# openSciLab's own components: the chips of a 6502 breadboard computer (examples/library/14-circuits/07-w65c02-computer)
# the processor, the interface adapter, the memories and the display are emulated with the circuit (circuits/mcu/bus_chips.py); the oscillator is a SPICE model
- type: cpu.w65c02
  title: W65C02S microprocessor
  category: Computer
  prefix: U
  keywords: 6502 65c02 w65c02s cpu microprocessor wdc breadboard computer
  description: 'The 8-bit CMOS 6502 of the Western Design Center (DIP-40, up to 14 MHz), drawn in the order of its pins on
    the breadboard. Emulated with the circuit, bus cycle by bus cycle: its pins drive and read the nets.'
  datasheet: https://www.westerndesigncenter.com/wdc/documentation/w65c02s.pdf
  role: mcu
  board: chip.w65c02
  symbol:
    shapes:
    - {rect: [-80, -210, 80, 210], fill: background}
    - {arc: [-8, -210, 0, -202, 8, -210]}
    - {text: W65C02S, at: [0, -10], size: 10}
    - {text: CPU, at: [0, 8], size: 7}
