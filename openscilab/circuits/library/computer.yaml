- type: oscillator
  title: Crystal oscillator
  category: Computer
  prefix: U
  keywords: oscillator crystal clock can dip14 xo quartz
  description: 'A crystal oscillator can (DIL-14 pinout: 1 NC, 7 GND, 8 OUT, 14 VCC): a square wave at its frequency between
    GND and its supply.'
  params:
  - {name: value, label: Frequency, unit: Hz, default: 2.4576 MHz, min: 1, description: The frequency of its output.}
  - {name: rise, label: Rise time, unit: s, default: 5 ns, min: 0, description: The time of each edge.}
  spice: '{ref:V}clk {ref}_clk 0 PULSE(0 1 0 {rise} {rise} {{max(0.5/value - rise, rise)}} {{1/value}})

    {ref:B}out {ref}_o {pin.7} V=V({pin.14},{pin.7})*V({ref}_clk)

    {ref:R}out {ref}_o {pin.8} 50

    {ref:R}supply {pin.14} {pin.7} 250'
  symbol:
    shapes:
    - {rect: [-40, -40, 40, 40], fill: background}
    - {line: [-14, 6, -7, 6, -7, -6, 0, -6, 0, 6, 7, 6, 7, -6, 14, -6]}
    - {text: OSC, at: [0, -22], size: 8}
    pins:
    - {number: '1', name: NC, at: [-60, -20], angle: 0, length: 20, kind: no_connect}
    - {number: '7', name: GND, at: [-60, 20], angle: 0, length: 20, kind: power_in}
    - {number: '8', name: OUT, at: [60, 20], angle: 180, length: 20, kind: output}
    - {number: '14', name: VCC, at: [60, -20], angle: 180, length: 20, kind: power_in}
    reference: {at: [0, -50]}
    value: {at: [0, 52]}
    pin_numbers: true
  show: [value]
  quality: generic
