circuit: W65C02 clock module
description: 'The clock of the W65C02 computer, simulated: the 555 (U7) runs astable, two Schmitt-trigger inverters (U6A, U6B) square its output, U8 gives 2.4576 MHz, SW2 single steps (debounced by R7/C3, U6C) and J1 picks one of them for PHI2 - the LED D1 blinks with it. Turn RV1 while it runs: the slower clock goes from about 480 Hz down to 0.7 Hz. The oscilloscope shows the timing capacitor (CH1) and PHI2 (CH2).'
version: 1
settings: {step: 20 us}
components:
  U7: {type: timer555, at: [0, 0], params: {value: NE555}}
  R5: {type: resistor, at: [-200, -170], rotation: 270, params: {value: 1k}}
  PWR1: {type: power, at: [-200, -200], params: {net: +5V, voltage: 5 V}}
  R6: {type: resistor, at: [-200, -70], rotation: 270, params: {value: 1k}}
  RV1: {type: potentiometer, at: [-200, 30], rotation: 270, params: {value: 1Meg, position: '0.002'}}
  C1: {type: capacitor.polarized, at: [-70, 160], rotation: 270, params: {value: 1u}}
  GND1: {type: ground, at: [-70, 180]}
  C2: {type: capacitor, at: [10, 160], rotation: 270, params: {value: 100n}}
  GND2: {type: ground, at: [10, 180]}
  U6A: {type: gate.schmitt, at: [260, -60], comment: '74HC14 gate 1: pin 1 -> 2 (Schmitt trigger)'}
  U6B: {type: gate.schmitt, at: [260, 20], comment: '74HC14 gate 2: pin 3 -> 4'}
  U8: {type: oscillator, at: [200, 140], params: {value: 2.4576 kHz}, comment: 2.4576 kHz here so that it runs live - the real can gives 2.4576 MHz}
  R7: {type: resistor, at: [-200, 300], rotation: 270, params: {value: 4.7k}}
  PWR2: {type: power, at: [-200, 270], params: {net: +5V, voltage: 5 V}}
  R8: {type: resistor, at: [-200, 400], rotation: 270, params: {value: '220'}}
  SW2: {type: button, at: [-200, 500], rotation: 270}
  GND3: {type: ground, at: [-200, 530]}
  C3: {type: capacitor.polarized, at: [-90, 380], rotation: 270, params: {value: 1u}}
  GND4: {type: ground, at: [-90, 400]}
  U6C: {type: gate.schmitt, at: [260, 330], comment: '74HC14 gate 3: pin 5 -> 6'}
  J1A: {type: switch, at: [420, -60], params: {state: '0'}, comment: 'J1 FAST: the jumper wire on this input (only one closed)'}
  J1B: {type: switch, at: [420, 20], params: {state: '1'}, comment: 'J1 SLOW: the jumper wire on this input (only one closed)'}
  J1C: {type: switch, at: [420, 100], params: {state: '0'}, comment: 'J1 STEP: the jumper wire on this input (only one closed)'}
  R9: {type: resistor, at: [560, -20], rotation: 270, params: {value: 1k}}
  D1: {type: led, at: [560, 120], rotation: 270, params: {value: LED_RED}}
  GND5: {type: ground, at: [560, 150]}
  P1: {type: probe.logic, at: [760, -120], params: {name: PHI2}}
  XSC1: {type: probe.scope, at: [960, 200], params: {time_div: 2 ms, volts_div: 2 V, offset: 4 V, level: 2.5 V}}
  GND6: {type: ground, at: [960, 280]}
  GND7: {type: ground, at: [0, 90]}
  PWR3: {type: power, at: [-80, -40], rotation: 90, params: {net: +5V, voltage: 5 V}}
  PWR4: {type: power, at: [0, -90], params: {net: +5V, voltage: 5 V}}
  GND8: {type: ground, at: [120, 160], rotation: 270}
  PWR5: {type: power, at: [280, 120], rotation: 270, params: {net: +5V, voltage: 5 V}}
wires:
  - [[-200, -140], [-200, -100]]
  - [[-200, -40], [-200, 0]]
  - [[-200, 60], [-200, 80]]
  - [[-180, 30], [-160, 30]]
  - [[-70, 140], [-70, 120]]
  - [[10, 140], [10, 120]]
  - [[-200, 330], [-200, 370]]
  - [[-200, 430], [-200, 470]]
  - [[-90, 360], [-90, 340]]
  - [[560, -50], [560, -70]]
  - [[560, 10], [560, 30]]
  - [[560, 90], [560, 70]]
  - [[700, -120], [760, -120]]
  - [[0, 70], [0, 90]]
  - [[-60, -40], [-80, -40]]
  - [[0, -70], [0, -90]]
  - [[140, 160], [120, 160]]
  - [[260, 120], [280, 120]]
  - [[220, -60], [70, -60], [70, -20], [60, -20]]
  - [[220, 20], [210, 20], [210, -30], [310, -30], [310, -60], [300, -60]]
  - [[390, -60], [330, -60], [330, 160], [260, 160]]
  - [[390, 20], [300, 20]]
  - [[390, 100], [350, 100], [350, 330], [300, 330]]
  - [[-60, 40], [-70, 40], [-70, 110], [-20, 110], [-20, 120], [10, 120]]
  - [[60, 40], [90, 40], [90, -130], [-200, -130]]
  - [[560, 70], [560, 30]]
  - [[560, -70], [700, -70], [700, -120]]
  - [[450, -60], [560, -60]]
  - [[450, 20], [460, 20], [460, -60]]
  - [[450, 100], [460, 100], [460, 20]]
  - [[870, 190], [750, 190], [750, -120]]
  - [[-90, 340], [-200, 340]]
  - [[220, 330], [-90, 330], [-90, 340]]
  - [[-160, 30], [-160, 70], [-200, 70]]
  - [[-60, 20], [-160, 20], [-160, 30]]
  - [[-70, 120], [-90, 120], [-90, 20]]
  - [[60, 20], [70, 20], [70, 80], [-90, 80]]
  - [[870, 170], [580, 170], [580, 210], [70, 210], [70, 80]]
labels: []
groups:
  - {name: Clock, comment: '555 0.7-480 Hz (RV1), U8 2.4576 MHz, SW2 single step; J1: close exactly one', color: green, members: [U7, R5, PWR1, R6, w1, RV1, w2, w3, w4, C1, w5, GND1, C2, w6, GND2, U6A, U6B, U8, R7, PWR2, R8, w7, SW2, w8, GND3, C3, w9, GND4, U6C, J1A, J1B, J1C, R9, w10, w11, D1, w12, GND5]}
  - {name: Measure, comment: PHI2 is the logic channel the flow measures, color: blue, members: [w13, P1, XSC1, GND6]}
