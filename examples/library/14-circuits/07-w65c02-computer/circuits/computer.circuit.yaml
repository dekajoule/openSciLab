circuit: W65C02 breadboard computer
description: 'The complete computer (V1.0) - and it runs: the W65C02S executes firmware/hello.bin from the EEPROM U3 (its Image: a .bin or .hex file, as a programmer writes it), RAM $0000-$3FFF, the VIA at $6000 drives the LCD (its text in the serial monitor) and the four LEDs on PA0-PA3 count. The chips are emulated bus cycle by bus cycle, the decoder (U5), the clock (U8, J1 on FAST - 10 kHz here, so that it runs; the 555 on SLOW) and the LEDs are the circuit. The probes LA1-LA34 are a logic analyzer''s: the data view captures them, flows/trace.flow.yaml decodes the bus, and a simulated Arduino Mega with the signals scenario Circuit traces them as Ben Eater''s monitor does (profile W65C02 breadboard computer - Arduino Mega 2560). Every connection is a wire: the address bus runs above the chips, the data bus below them.'
version: 1
settings: {start: power on, step: 10 us, tolerance: '0.05', logic_edge: 100 ns}
